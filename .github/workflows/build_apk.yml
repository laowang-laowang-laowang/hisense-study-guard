name: 一键云端打包生成电视端 APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch: # 允许在 GitHub 网页上直接点击按钮手动触发构建

jobs:
  build-apk:
    name: 自动化编译 Android TV APK 安装包
    runs-on: ubuntu-latest

    steps:
      - name: 检出项目源代码
        uses: actions/checkout@v4

      - name: 配置 Java 17 编译环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置 Android SDK 环境
        uses: android-actions/setup-android@v3

      - name: 配置 Gradle 8.4 构建工具
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: 执行一键打包命令 (assembleDebug)
        run: gradle assembleDebug --stacktrace

      - name: 收集并发布安装包 (上传至网页直接下载)
        uses: actions/upload-artifact@v4
        with:
          name: Hisense-StudyGuard-TV-v1.0.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
