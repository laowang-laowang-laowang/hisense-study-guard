name: 一键云端打包生成电视端 APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: 自动化编译 Android TV APK 安装包
    runs-on: ubuntu-latest

    steps:
      - name: 检出项目源代码
        uses: actions/checkout@v4

      - name: 配置 Java 17 编译环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 高速下载并就绪 Gradle 8.4
        run: |
          wget -q https://downloads.gradle-dn.com/distributions/gradle-8.4-bin.zip -O gradle.zip || \
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.4/bin" >> $GITHUB_PATH

      - name: 执行打包编译 (assembleDebug)
        run: gradle assembleDebug --stacktrace

      - name: 上传 APK 安装包至网页下载
        uses: actions/upload-artifact@v4
        with:
          name: Hisense-StudyGuard-TV-v1.0.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
